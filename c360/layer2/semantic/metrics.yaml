# Governed metrics. The agent picks a metric and its parameters; code builds the SQL from these
# tested templates, so a number means the same thing every time it is asked for.
#
# On the DB machine every official definition in curated.metric_definitions was translated into a
# template below (`status: verified`, `defined_in: metric_definitions:<id>`). The translation follows
# the official business definition, formula, time basis and default filters literally; where the
# official text leaves a choice open, the choice is written in `notes` (and in CHANGELOG_LAYER2.md).
# Metrics with no official counterpart stay `status: placeholder` and are labelled as such in answers.
#
# Fields
#   unit            ratio | count | amount | days
#   numerator, denominator   (ratio metrics)  value = numerator / denominator
#   value           (count / amount / days metrics) the aggregate expression
#   from            FROM clause, L2 tables only, always schema-qualified
#   date_column     the date the `period` argument filters on
#   date_meaning    said to the agent so it knows which date a period applies to
#   default_period  used when the agent passes no period
#   default_filters conditions that are always applied
#   dimensions      allowed group_by / filter names -> SQL expression (or {expr, type: int|float|bool})
#   sql             full template instead of numerator/denominator/from, with the placeholders
#                   {dims} {filters} {group_by} and the parameters $start and $end
#   aliases         other names the metric answers to (official synonyms included)

# ======================== official metrics (curated.metric_definitions) ========================

promise_kept_rate:
  label: Promise-kept rate
  description: Share of resolved promises (kept, partially kept or broken) due in the period that were kept in full. Open and cancelled promises are left out.
  status: verified
  defined_in: metric_definitions:promise_kept_rate
  aliases: [PTP kept rate, promise kept, kept promises]
  unit: ratio
  numerator: "count(*) FILTER (WHERE p.ptp_status = 'kept')"
  denominator: "count(*)"
  from: "l2.promises_to_pay p LEFT JOIN l2.collections_cases c ON c.case_id = p.case_id LEFT JOIN l2.agents ag ON ag.agent_id = p.agent_id"
  date_column: p.ptp_due_date
  date_meaning: promise due date
  default_filters:
    - "p.ptp_status IN ('kept', 'partially_kept', 'broken')"
  dimensions: &promise_dims
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    channel: p.ptp_channel
    bucket: c.current_bucket
    test_cell: c.test_cell
    assignment_method: c.assignment_method
    agent_site: ag.site
    prior_broken_promises: {expr: "least(p.prior_broken_ptp_count, 3)", type: int}   # 3 = 3 or more (4+ are under 0.2% of promises)
    ptp_type: p.ptp_type
    month: "strftime(p.ptp_due_date, '%Y-%m')"
  notes: Promises taken with no agent (portal, IVR, SMS) have no agent site (null group).

broken_promise_rate:
  label: Broken promise rate
  description: Share of resolved promises (kept, partially kept or broken) due in the period that were broken. Open and cancelled promises are left out.
  status: verified
  defined_in: metric_definitions:broken_promise_rate
  aliases: [promise_broken_rate, broken PTP rate, PTP break rate, broken-promise rate]
  unit: ratio
  numerator: "count(*) FILTER (WHERE p.ptp_status = 'broken')"
  denominator: "count(*)"
  from: "l2.promises_to_pay p LEFT JOIN l2.collections_cases c ON c.case_id = p.case_id LEFT JOIN l2.agents ag ON ag.agent_id = p.agent_id"
  date_column: p.ptp_due_date
  date_meaning: promise due date
  default_filters:
    - "p.ptp_status IN ('kept', 'partially_kept', 'broken')"
  dimensions: *promise_dims

cure_rate:
  label: Cure rate
  description: Share of collections cases open at the start of the period that returned to current (cured) within the period. Cases on an insolvency or deceased hold are left out.
  status: verified
  defined_in: metric_definitions:cure_rate
  aliases: [self-cure, back to current, cured, cure rate]
  unit: ratio
  date_column: c.cure_date
  date_meaning: "cases open on the first day of the period; cures dated inside the period (official time basis: calendar month)"
  sql: |
    SELECT {dims}
           count(*) FILTER (WHERE c.cure_flag AND CAST(c.cure_date AS DATE) BETWEEN $start AND $end) AS numerator,
           count(*) AS denominator,
           CAST(count(*) FILTER (WHERE c.cure_flag AND CAST(c.cure_date AS DATE) BETWEEN $start AND $end) AS DOUBLE)
             / nullif(count(*), 0) AS value
    FROM l2.collections_cases c
    WHERE CAST(c.case_open_date AS DATE) <= $start
      AND (c.outcome_date IS NULL OR CAST(c.outcome_date AS DATE) >= $start)
      AND NOT coalesce(c.insolvency_hold_flag, false)
      AND NOT coalesce(c.deceased_hold_flag, false){filters}
    {group_by}
  dimensions:
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    bucket: c.current_bucket
    test_cell: c.test_cell
    assignment_method: c.assignment_method
    hardship: {expr: c.hardship_flag, type: bool}
    province: c.province_code
  notes: "'Open at the start of the period' = opened on or before the first day and not closed before it."

roll_rate:
  label: Roll rate
  description: Share of accounts in a delinquency bucket at the snapshot on or before the start of the period that are in a worse bucket at the snapshot on or before the end of the period. Buckets are worked out from days past due (dpd), because in the snapshot table about 4% of stored buckets disagree with dpd, and most rows stored as 1-30 have dpd 0, which would dilute the rate. Charged-off accounts and accounts in a case on insolvency hold are left out. Snapshots exist at quarter-ends only (Mar 31, Jun 30, Sep 30, Dec 31). Filter from_bucket for the roll rate out of one bucket.
  status: verified
  defined_in: metric_definitions:roll_rate
  aliases: [flow rate, roll forward, deterioration]
  unit: ratio
  date_column: a.month_end_date
  date_meaning: "start snapshot = latest snapshot on or before the period start; end snapshot = latest on or before the period end"
  sql: |
    WITH snaps AS (
      SELECT (SELECT max(month_end_date) FROM l2.account_monthly_snapshot WHERE CAST(month_end_date AS DATE) <= $start) AS d0,
             (SELECT max(month_end_date) FROM l2.account_monthly_snapshot WHERE CAST(month_end_date AS DATE) <= $end) AS d1
    ),
    held AS (
      SELECT DISTINCT unnest(account_ids) AS account_id FROM l2.collections_cases WHERE insolvency_hold_flag
    ),
    snap AS (
      SELECT account_id, month_end_date, product_type, account_status, write_off_flag,
             CASE WHEN dpd IS NULL THEN NULL WHEN dpd <= 0 THEN 'current' WHEN dpd <= 30 THEN '1-30' WHEN dpd <= 60 THEN '31-60'
                  WHEN dpd <= 90 THEN '61-90' WHEN dpd <= 120 THEN '91-120' WHEN dpd <= 150 THEN '121-150'
                  WHEN dpd <= 180 THEN '151-180' ELSE '180+' END AS bucket
      FROM l2.account_monthly_snapshot
    )
    SELECT {dims}
           count(*) FILTER (WHERE list_position(['current', '1-30', '31-60', '61-90', '91-120', '121-150', '151-180', '180+'], b.bucket)
                                > list_position(['current', '1-30', '31-60', '61-90', '91-120', '121-150', '151-180', '180+'], a.bucket)) AS numerator,
           count(*) AS denominator,
           CAST(count(*) FILTER (WHERE list_position(['current', '1-30', '31-60', '61-90', '91-120', '121-150', '151-180', '180+'], b.bucket)
                                     > list_position(['current', '1-30', '31-60', '61-90', '91-120', '121-150', '151-180', '180+'], a.bucket)) AS DOUBLE)
             / nullif(count(*), 0) AS value
    FROM snaps
    JOIN snap a ON a.month_end_date = snaps.d0
    LEFT JOIN snap b ON b.account_id = a.account_id AND b.month_end_date = snaps.d1
    WHERE snaps.d1 > snaps.d0
      AND a.bucket IS NOT NULL
      AND NOT coalesce(a.write_off_flag, false)
      AND coalesce(a.account_status, '') <> 'charged_off'
      AND a.account_id NOT IN (SELECT account_id FROM held WHERE account_id IS NOT NULL){filters}
    {group_by}
  dimensions:
    from_bucket: a.bucket
    product: a.product_type
    product_family: "CASE WHEN a.account_id LIKE 'C-%' THEN 'card' WHEN a.account_id LIKE 'L-%' THEN 'loan' ELSE 'deposit' END"
  notes: "Accounts in a bucket at the start that have no row at the end count in the denominator and not as rolled (official formula: count(worse at end) / count(in bucket at start)). The official time basis is month-end to month-end; the data has quarter-end snapshots, so a period inside one quarter has no start-to-end pair and returns nothing."

rpc_rate:
  label: Right-party contact rate
  description: Share of outbound call attempts in the period that reached the customer (right-party contact). Double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:rpc_rate
  aliases: [RPC rate, contact rate, reach rate, right party contact rate]
  unit: ratio
  numerator: "count(*) FILTER (WHERE h.rpc_flag)"
  denominator: "count(*)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.direction = 'outbound'"
    - "h.channel = 'call'"
  dimensions: &call_dims
    queue: c.queue
    product: c.primary_product
    hardship_reason: c.hardship_reason
    bucket: c.current_bucket
    hour: {expr: h.contact_hour_local, type: int}
    day_of_week: h.day_of_week
    agent_site: h.agent_site
    province: c.province_code
    test_cell: c.test_cell
    month: "strftime(h.contact_ts_local, '%Y-%m')"

ptp_rate:
  label: PTP rate
  description: Promises to pay taken per right-party contact in the period (share of right-party contacts where a promise was made). Double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:ptp_rate
  aliases: [promise rate, PTP per RPC, promise to pay rate]
  unit: ratio
  numerator: "count(*) FILTER (WHERE h.ptp_made_flag)"
  denominator: "count(*)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.rpc_flag"
  dimensions:
    channel: h.channel
    direction: h.direction
    queue: c.queue
    product: c.primary_product
    agent_site: h.agent_site
    hour: {expr: h.contact_hour_local, type: int}
    test_cell: c.test_cell
    month: "strftime(h.contact_ts_local, '%Y-%m')"

cost_per_contact:
  label: Cost per contact
  description: Average contact cost in CAD (total contact cost / number of contacts) in the period. System events and double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:cost_per_contact
  aliases: [contact cost, cost per attempt]
  unit: amount
  value: "sum(h.contact_cost_cad) / nullif(count(*), 0)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.channel <> 'system'"
  dimensions: &contact_dims
    channel: h.channel
    direction: h.direction
    queue: c.queue
    product: c.primary_product
    agent_site: h.agent_site
    month: "strftime(h.contact_ts_local, '%Y-%m')"

cost_per_rpc:
  label: Cost per right-party contact
  description: Total contact cost in CAD divided by the number of right-party contacts in the period. System events and double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:cost_per_rpc
  aliases: [cost per RPC]
  unit: amount
  value: "sum(h.contact_cost_cad) / nullif(count(*) FILTER (WHERE h.rpc_flag), 0)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.channel <> 'system'"
  dimensions: *contact_dims

collected_amount:
  label: Amount collected
  description: Payments received against promises to pay on collections cases, by payment date (CAD).
  status: verified
  defined_in: metric_definitions:collected_amount
  aliases: [collections, recoveries, dollars collected, amount paid against promises]
  unit: amount
  value: "coalesce(sum(p.amount_paid_against), 0)"
  from: "l2.promises_to_pay p LEFT JOIN l2.collections_cases c ON c.case_id = p.case_id"
  date_column: p.paid_date
  date_meaning: date the payment was received
  default_filters:
    - "p.amount_paid_against > 0"
  dimensions:
    product: c.primary_product
    queue: c.queue
    channel: p.ptp_channel
    ptp_status: p.ptp_status
    month: "strftime(p.paid_date, '%Y-%m')"
  notes: "The official formula is 'sum(payments received on case accounts)' with source tables collections_cases and promises_to_pay; the payment-level data available is promises_to_pay.amount_paid_against with paid_date, so that is what is summed."

hardship_rate:
  label: Hardship rate
  description: Share of collections cases opened in the period with financial hardship recorded (agent-coded hardship_flag).
  status: verified
  defined_in: metric_definitions:hardship_rate
  aliases: [hardship share, hardship cases]
  unit: ratio
  numerator: "count(*) FILTER (WHERE c.hardship_flag)"
  denominator: "count(*)"
  from: "l2.collections_cases c"
  date_column: c.case_open_date
  date_meaning: date the case opened
  default_filters: []
  dimensions:
    product: c.primary_product
    queue: c.queue
    bucket: c.current_bucket
    province: c.province_code
    month: "strftime(c.case_open_date, '%Y-%m')"

delinquency_rate:
  label: Delinquency rate
  description: Share of active card and loan accounts that are 1 or more days past due, on the current snapshot. Active = on the current snapshot (closed and charged-off accounts are left out). Accounts with no dpd are left out.
  status: verified
  defined_in: metric_definitions:delinquency_rate
  aliases: [delinquent share, arrears rate]
  unit: ratio
  numerator: "count(*) FILTER (WHERE a.dpd >= 1)"
  denominator: "count(*)"
  from: >-
    (SELECT 'card' AS product_family, product_code AS product, dpd, snapshot_date, dq_stale_snapshot FROM l2.card_accounts
     UNION ALL
     SELECT 'loan' AS product_family, product_type AS product, dpd, snapshot_date, dq_stale_snapshot FROM l2.loan_accounts) a
  date_column: a.snapshot_date
  date_meaning: snapshot date (the current snapshot; leave the period out)
  default_period: all time
  default_filters:
    - "NOT a.dq_stale_snapshot"
    - "a.dpd IS NOT NULL"
  dimensions:
    product_family: a.product_family
    product: a.product
  notes: "Card accounts on the current snapshot have status active or blocked; closed and charged-off accounts only appear as older (stale) snapshot rows."

write_off_rate:
  label: Write-off rate
  description: Share of card and loan accounts charged off in the period (charge-off date in the period / all accounts).
  status: verified
  defined_in: metric_definitions:write_off_rate
  aliases: [charge-off rate, loss rate, chargeoff rate]
  unit: ratio
  date_column: a.chargeoff_date
  date_meaning: charge-off date
  sql: |
    SELECT {dims}
           count(*) FILTER (WHERE CAST(a.chargeoff_date AS DATE) BETWEEN $start AND $end) AS numerator,
           count(*) AS denominator,
           CAST(count(*) FILTER (WHERE CAST(a.chargeoff_date AS DATE) BETWEEN $start AND $end) AS DOUBLE) / nullif(count(*), 0) AS value
    FROM (SELECT 'card' AS product_family, product_code AS product, chargeoff_date FROM l2.card_accounts
          UNION ALL
          SELECT 'loan' AS product_family, product_type AS product, chargeoff_date FROM l2.loan_accounts) a
    WHERE true{filters}
    {group_by}
  dimensions: &writeoff_dims
    product_family: a.product_family
    product: a.product

write_off_count:
  label: Accounts charged off
  description: Number of card and loan accounts charged off in the period (the numerator of the write-off rate).
  status: verified
  defined_in: metric_definitions:write_off_rate (numerator)
  aliases: [charge-offs, charged off accounts, write-offs]
  unit: count
  value: "count(*)"
  from: &writeoff_from >-
    (SELECT 'card' AS product_family, product_code AS product, chargeoff_date, chargeoff_amount FROM l2.card_accounts
     UNION ALL
     SELECT 'loan' AS product_family, product_type AS product, chargeoff_date, chargeoff_amount FROM l2.loan_accounts) a
  date_column: a.chargeoff_date
  date_meaning: charge-off date
  default_filters: []
  dimensions: *writeoff_dims

write_off_amount:
  label: Amount charged off
  description: Total amount charged off (CAD) on card and loan accounts charged off in the period.
  status: verified
  defined_in: metric_definitions:write_off_rate (amount of the numerator)
  aliases: [charge-off amount, written off amount, loss amount]
  unit: amount
  value: "coalesce(sum(a.chargeoff_amount), 0)"
  from: *writeoff_from
  date_column: a.chargeoff_date
  date_meaning: charge-off date
  default_filters: []
  dimensions: *writeoff_dims

average_dpd:
  label: Average days past due of open cases
  description: Average current days past due of collections cases that are open now. The period, if given, filters on the case open date.
  status: verified
  defined_in: metric_definitions:average_dpd
  aliases: [mean DPD, average arrears age]
  unit: days
  value: "avg(c.current_dpd)"
  from: "l2.collections_cases c"
  date_column: c.case_open_date
  date_meaning: date the case opened
  default_period: all time
  default_filters:
    - "c.is_open"
  dimensions:
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    bucket: c.current_bucket
    treatment: c.current_treatment
    month: "strftime(c.case_open_date, '%Y-%m')"

contact_attempts_per_case:
  label: Attempts per case
  description: Outbound contact attempts per collections case in the period (outbound attempts / distinct cases contacted). Double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:contact_attempts_per_case
  aliases: [contact intensity, touches per case, attempts per case]
  unit: ratio
  numerator: "count(*)"
  denominator: "count(DISTINCT h.case_id)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.direction = 'outbound'"
  dimensions: &attempt_dims
    channel: h.channel
    queue: c.queue
    product: c.primary_product
    bucket: c.current_bucket
    open_case: {expr: c.is_open, type: bool}
    hardship_reason: c.hardship_reason
    hour: {expr: h.contact_hour_local, type: int}
    month: "strftime(h.contact_ts_local, '%Y-%m')"

contact_attempts:
  label: Outbound contact attempts
  description: Number of outbound contact attempts in the period (the numerator of attempts per case). Double-loaded contacts are excluded.
  status: verified
  defined_in: metric_definitions:contact_attempts_per_case (numerator)
  aliases: [outbound attempts]
  unit: count
  value: "count(*)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.direction = 'outbound'"
  dimensions: *attempt_dims

payroll_delay_share:
  label: Payroll delay share
  description: Share of customers with a payroll deposit into a chequing account whose payroll is more than 7 days late, on the current snapshot.
  status: verified
  defined_in: metric_definitions:payroll_delay_share
  aliases: [late payroll, missed pay]
  unit: ratio
  numerator: "count(DISTINCT d.c360_id) FILTER (WHERE d.payroll_delay_days > 7)"
  denominator: "count(DISTINCT d.c360_id)"
  from: "l2.deposit_accounts d LEFT JOIN l2.customer_summary cs ON cs.c360_id = d.c360_id"
  date_column: d.snapshot_date
  date_meaning: snapshot date (the current snapshot; leave the period out)
  default_period: all time
  default_filters:
    - "d.product_type = 'chequing'"
    - "d.payroll_deposit_flag"
    - "NOT d.dq_stale_snapshot"
  dimensions:
    with_open_case: {expr: "coalesce(cs.open_cases, 0) > 0", type: bool}
    hardship_flag: {expr: cs.financial_hardship_flag, type: bool}

# ======================== placeholders (no official definition) ========================

promise_count:
  label: Promises made
  description: Number of promises to pay made (created) in the period, whatever their status.
  status: placeholder
  unit: count
  value: "count(*)"
  from: "l2.promises_to_pay p LEFT JOIN l2.collections_cases c ON c.case_id = p.case_id"
  date_column: p.ptp_created_ts
  date_meaning: date the promise was made
  default_filters: []
  dimensions:
    status: p.ptp_status
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    channel: p.ptp_channel
    month: "strftime(p.ptp_created_ts, '%Y-%m')"

payment_on_contact_amount:
  label: Payments taken on contacts
  description: Total amount of payments taken during contacts in the period. Double-loaded contacts are excluded.
  status: placeholder
  unit: amount
  value: "coalesce(sum(h.payment_amount), 0)"
  from: "l2.contact_history h LEFT JOIN l2.collections_cases c ON c.case_id = h.case_id"
  date_column: h.contact_ts_local
  date_meaning: contact date (customer's local time)
  default_filters:
    - "h.is_duplicate = false"
    - "h.payment_taken_flag"
  dimensions:
    channel: h.channel
    direction: h.direction
    queue: c.queue
    product: c.primary_product
    month: "strftime(h.contact_ts_local, '%Y-%m')"

hardship_offer_acceptance_rate:
  label: Hardship offer acceptance rate
  description: Share of hardship and payment-plan offers made in the period that the customer accepted.
  status: placeholder
  unit: ratio
  numerator: "count(*) FILTER (WHERE o.customer_response = 'accepted')"
  denominator: "count(*)"
  from: "l2.offers o LEFT JOIN l2.collections_cases c ON c.case_id = o.case_id"
  date_column: o.offer_ts
  date_meaning: date the offer was made
  default_filters: []
  dimensions:
    program: o.program_id
    offered_by: o.offered_by
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    month: "strftime(o.offer_ts, '%Y-%m')"

open_case_count:
  label: Open collections cases
  description: Number of collections cases that are open now (no outcome yet). The period, if given, filters on the case open date.
  status: placeholder
  unit: count
  value: "count(*)"
  from: "l2.collections_cases c"
  date_column: c.case_open_date
  date_meaning: date the case opened
  default_period: all time
  default_filters:
    - "c.is_open"
  dimensions:
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    bucket: c.current_bucket
    treatment: c.current_treatment
    month: "strftime(c.case_open_date, '%Y-%m')"

past_due_amount:
  label: Past-due amount on open cases
  description: Sum of the overdue amount on collections cases that are open now. The period, if given, filters on the case open date.
  status: placeholder
  unit: amount
  value: "coalesce(sum(c.total_overdue), 0)"
  from: "l2.collections_cases c"
  date_column: c.case_open_date
  date_meaning: date the case opened
  default_period: all time
  default_filters:
    - "c.is_open"
  dimensions:
    product: c.primary_product
    queue: c.queue
    hardship_reason: c.hardship_reason
    bucket: c.current_bucket
    treatment: c.current_treatment
    month: "strftime(c.case_open_date, '%Y-%m')"
