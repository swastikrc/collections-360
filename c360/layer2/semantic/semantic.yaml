joins:
  - promises_to_pay.case_id = collections_cases.case_id
  - offers.case_id = collections_cases.case_id
  - contact_history.case_id = collections_cases.case_id
  - agent_notes.case_id = collections_cases.case_id
  - call_transcripts.case_id = collections_cases.case_id
  - call_transcripts.contact_id = contact_history.contact_id
  - contact_history.ptp_id = promises_to_pay.ptp_id
  - model_scores.case_id = collections_cases.case_id (case-level models)
  - collections_cases.primary_account_id = card_accounts.card_account_id (when primary_product = 'card')
  - collections_cases.primary_account_id = loan_accounts.loan_id (when primary_product = 'loan')
  - account_monthly_snapshot.account_id = card_accounts.card_account_id or loan_accounts.loan_id
  - salary_credit_history.deposit_account_id = deposit_accounts.deposit_account_id
  - offers.program_id = hardship_programs.program_id
  - collections_cases.assigned_agent_id = agents.agent_id; contact_history.agent_id = agents.agent_id
  - every table with c360_id joins to customers and customer_summary on c360_id (person level)

terms:
  broken promise: promises_to_pay.ptp_status = 'broken'
  kept promise: promises_to_pay.ptp_status = 'kept' (paid in full by the due date)
  resolved promise: ptp_status IN ('kept', 'partially_kept', 'broken'); promise rates use resolved promises only (open = not yet due, cancelled = withdrawn)
  promise due: a promise whose ptp_due_date falls in the period
  self-serve promise: a promise taken without an agent (promises_to_pay.agent_id IS NULL; ptp_channel ivr | web | sms_reply | app)
  open case: collections_cases.is_open (outcome IS NULL); case_status can be open, insolvency_hold, legal or placed_agency while open
  closed case: collections_cases.outcome IS NOT NULL; outcome_date is when it closed
  cured: collections_cases.cure_flag, dated by cure_date
  delinquent: dpd >= 1 (bucket other than 'current')
  active account: an account on the current snapshot (dq_stale_snapshot = false); closed and charged-off accounts only appear as older snapshot rows
  charged off / written off: card_accounts or loan_accounts.chargeoff_flag, dated by chargeoff_date, amount chargeoff_amount
  roll rate: share of accounts in a bucket at one snapshot that are in a worse bucket at a later snapshot; account_monthly_snapshot has quarter-end snapshots only
  right-party contact (RPC): contact_history.rpc_flag
  contact attempt: an outbound contact (direction = 'outbound'); system events have direction 'internal'
  call attempt: an outbound call (direction = 'outbound' AND channel = 'call')
  outside permitted hours: contact_history.within_permitted_hours_flag = false
  dispute: contact_history.dispute_raised_flag (raised on a contact) or collections_cases.dispute_flag (case has a dispute). The kind of dispute (dispute_type) is recorded only on the case, never on the contact - to count disputes raised in a period, count contacts with dispute_raised_flag in that period; do not filter them by the case's dispute_type
  hardship case: collections_cases.hardship_flag (agent-coded hardship; hardship_source says who recorded it)
  customer in financial hardship: customer_summary.financial_hardship_flag
  unsecured loan: loan_accounts.secured_flag = false (personal_loan, unsecured_loc, student_loc); secured = auto_loan, mortgage
  randomised cases: collections_cases.assignment_method = 'random'; test_cell is champion | challenger_A | challenger_B | no_contact_holdout
  duplicate contact: contact_history.is_duplicate (a double-loaded copy of another contact)
  past due amount: collections_cases.total_overdue for cases; past_due_amount for accounts
  customer province: collections_cases.province_code (at case open) or customers.province_code

rules:
  - Reported figures use STORED values (dpd_bucket, current_bucket). Use *_recomputed columns only for data-quality questions, with purpose = "data_quality".
  - Rates over contacts use is_duplicate = false. For a plain COUNT of contacts or events, return both figures in one query - the count as loaded (all rows) first, and the count without double-loaded rows (is_duplicate = false) - and state both.
  - All relative dates are relative to the snapshot date, never today's date. Never use current_date or now().
  - Count distinct entity ids (case_id, c360_id, account id) when a join can multiply rows.
  - Exclude model_scores rows with dq_superseded_duplicate = true.
  - Free text (note_text, transcript_text) is read only through search_text, never selected in SQL.
  - Rates are returned as ratios between 0 and 1; say them as percentages in the answer.

# code_type in l2.code_lookups -> the column it explains. Only these are loaded into the prompt.
code_columns:
  outcome_code: contact_history.outcome_code
  product_code: card_accounts.product_code
  strategy_code: collections_cases.strategy_code

not_allowed:
  marketing: Marketing, cross-sell or sales targeting of collections customers.
  protected_attributes: Analysis or decisions by protected attributes (gender, marital status, citizenship, religion, ethnicity, age, disability, vulnerability, household or newcomer status) or by proxies for them such as postal area, neighbourhood or language.
  automated_adverse_action: Automated adverse action against customers (for example freezing, closing, charging off or reporting accounts) without a human able to review each case.
  bulk_contact_export: Exporting or listing customers' contact details (phone numbers, emails, addresses) or bulk lists of identifiable customers.
