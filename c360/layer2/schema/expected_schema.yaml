# What Layer 2 expects to find in Layer 1's c360.duckdb (schemas `curated` and `golden`).
#
# Source: SPEC_LAYER2.md Appendix A, which was derived by reading the Layer 1 code.
#   confirmed = referenced in Layer 1 code or the sample document, so it exists on the real machine
#   inferred  = plausible but never seen; fix on the DB machine (DB_MACHINE_RUNBOOK.md, Step 3)
#   protected = confirmed to exist in the source, and must never reach the serving database
#
# Types are coarse classes: string | int | float | bool | date | timestamp | list.
# int and float are treated as compatible by the doctor.
# The synthetic generator (python -m c360.layer2.synth) builds exactly these tables.

