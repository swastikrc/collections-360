    - {tool: run_sql, args: {purpose: analysis, query: "SELECT count(*) AS accepted FROM l2.offers WHERE customer_response = 'accepted' AND CAST(offer_ts AS DATE) BETWEEN DATE '2026-04-01' AND DATE '2026-06-30'"}}

