# Held-out questions for the synthetic world. Written BEFORE any tuning of semantic.yaml,
# metrics.yaml or the prompt, and never used to tune them: a failure here is evidence about
# generalisation, not a to-do. Expected answers are resolved from synth/truth.py at load time
# (`truth`), so they stay correct if the synthetic world is regenerated.
# `fake_plan` is used only by the offline fake LLM (`eval --fake`).

- id: H01
  question: For card cases only, what share of promises due between 1 January and 30 June 2026 were kept?
  expected: {kind: scalar, unit: ratio, truth: {fn: promise_kept_rate, args: {start: "2026-01-01", end: "2026-06-30", where: {product: card}}}}
  tags: [governed, promises, filter]
  fake_plan:
    - {tool: compute_metric, args: {metric: promise_kept_rate, period: "2026-01-01 to 2026-06-30", filters: [{dimension: product, op: "=", value: card}]}}

- id: H02
  question: Last month, how did the broken-promise rate differ by the channel the promise was made on?
  expected: {kind: table, key: [channel], unit: ratio, truth: {fn: broken_promise_rate, args: {start: "2026-08-01", end: "2026-08-31", by: channel}}}
  tags: [governed, promises]
  fake_plan:
    - {tool: compute_metric, args: {metric: broken_promise_rate, period: last month, group_by: [channel]}}

