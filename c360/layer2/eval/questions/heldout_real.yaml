# Held-out questions on the REAL data (DB machine, runbook Step 7). Written before any live run and never used to
# tune prompts or semantic files. None is a rewording of a benchmark question. Every expected answer comes from the
# hand-written SQL in `check_sql`, run directly on the serving database (not through compute_metric), and was checked.
# Periods follow the system's convention: a calendar month or quarter is inclusive; periods end on the snapshot date.
# Regenerate after a new serving build: the expected values are data, not code.

- id: R01
  question: What was the promise-kept rate for promises due between 1 April and 30 June 2026?
  expected:
    kind: scalar
    value: 0.5269267107571872
    unit: ratio
  tags:
  - governed
  - promises
  check_sql: SELECT avg((ptp_status='kept')::int) FROM l2.promises_to_pay WHERE ptp_status IN ('kept','partially_kept','broken') AND ptp_due_date BETWEEN '2026-04-01' AND '2026-06-30'
  fake_plan:
  - tool: compute_metric
    args:
      metric: promise_kept_rate
      period: 2026-04-01 to 2026-06-30
- id: R02
  question: For promises due in Q2 2026, how did the broken-promise rate vary by the channel the promise was made on?
  expected:
    kind: table
    key:
    - channel
    unit: ratio
    rows:
    - channel: web
      value: 0.3794642857142857
    - channel: app
      value: 0.5104895104895105
    - channel: call
      value: 0.4460908454119295
    - channel: ivr
      value: 0.36227272727272725
    - channel: sms_reply
      value: 0.5359877488514548
  tags:
  - governed
  - promises
  check_sql: SELECT ptp_channel, avg((ptp_status='broken')::int) FROM l2.promises_to_pay WHERE ptp_status IN ('kept','partially_kept','broken') AND ptp_due_date BETWEEN '2026-04-01' AND '2026-06-30' GROUP
    BY 1
  fake_plan:
  - tool: compute_metric
    args:
      metric: broken_promise_rate
      period: Q2 2026
      group_by:
      - channel
