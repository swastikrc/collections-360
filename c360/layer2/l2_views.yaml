# The Layer 2 serving database: one entry per table in schema `l2`.
#
# The `columns` allow-list is the ONLY way a column enters the serving database. `{cols}` in
# `source` is replaced by "<expression> AS <l2 name>" for each allow-listed column. There is no
# SELECT * from a source table, anywhere.
#
#   required: true       publish aborts (doctor ERROR) if a non-optional column does not bind
#   required: false      the table is skipped with a warning if its source does not exist
#   optional: true       the column is skipped with a warning if its source column is missing
#                        (every INFERRED column is optional)
#   confidence           confirmed | inferred (see schema/expected_schema.yaml)
#
# Never allow-list a column that matches c360/layer2/deny_list.py: publish and the doctor both
# fail if you do. `src` is Layer 1's c360.duckdb, attached read-only.

customers:
  grain: one row per person
  description: Non-identifying customer attributes, consent and servicing flags. No names, dates of birth, contact details or protected attributes.
  required: true
  confidence: confirmed
  source: |
    SELECT {cols}
    FROM src.golden.crm_person_map pm
    JOIN src.curated.customers c ON c.crm_customer_id = pm.crm_customer_id
    GROUP BY pm.c360_id
  columns:
    c360_id: pm.c360_id
    segment: any_value(c.segment) FILTER (WHERE pm.is_master)
    tenure_months: max(c.tenure_months)
    customer_since_date: min(c.customer_since_date)
    province_code: arg_max(c.province_code_std, c.last_profile_update_ts)
    customer_status: arg_max(c.customer_status, c.last_profile_update_ts)
    employment_status: arg_max(c.employment_status, c.last_profile_update_ts)
    occupation_category: arg_max(c.occupation_category, c.last_profile_update_ts)
    pay_frequency: arg_max(c.pay_frequency, c.last_profile_update_ts)
    declared_annual_income: arg_max(c.declared_annual_income, c.last_profile_update_ts)
    income_verified_flag: bool_or(c.income_verified_flag)
    income_source: arg_max(c.income_source, c.last_profile_update_ts)
    housing_status: arg_max(c.housing_status, c.last_profile_update_ts)
    monthly_housing_cost: arg_max(c.monthly_housing_cost, c.last_profile_update_ts)
    internal_risk_grade: arg_max(c.internal_risk_grade, c.last_profile_update_ts)
    preferred_language: arg_max(c.preferred_language, c.last_profile_update_ts)
    preferred_channel: arg_max(c.preferred_channel, c.last_profile_update_ts)
    # consent: the strictest value across the person's CRM records (as in golden.py)
    consent_call: bool_and(coalesce(c.consent_call, false))
    consent_autodialer: bool_and(coalesce(c.consent_autodialer, false))
    consent_sms: bool_and(coalesce(c.consent_sms, false))
    consent_email: bool_and(coalesce(c.consent_email, false))
    voicemail_permitted: bool_and(coalesce(c.voicemail_permitted, false))
    contact_at_work_permitted: bool_and(coalesce(c.contact_at_work_permitted, false))
    internal_do_not_call: bool_or(c.internal_do_not_call_flag)
    cease_communication: bool_or(c.cease_communication_flag)
    third_party_authorised: bool_or(c.third_party_authorised_flag)
    credit_counselling_agency: bool_or(c.credit_counselling_agency_flag)
    power_of_attorney: bool_or(c.power_of_attorney_flag)
    legal_representative: bool_or(c.legal_representative_flag)
    deceased: bool_or(c.deceased_flag)
    bankruptcy: bool_or(c.bankruptcy_flag)
    consumer_proposal: bool_or(c.consumer_proposal_flag)
    fraud_victim: bool_or(c.fraud_victim_flag)
    military_or_reserve: bool_or(c.military_or_reserve_flag)
    national_dncl_telemarketing_only: bool_or(c.national_dncl_flag)
    all_crm_records_deleted: bool_and(coalesce(c.is_deleted, false))
    crm_record_count: count(*)

customer_summary:
  kind: mongo                 # projected from MongoDB `customers`, not from DuckDB
  grain: one row per person
  description: Person-level roll-up from the Collections 360 document - hardship flag and reasons, exposure, open cases, identity link quality.
  required: true
  confidence: confirmed
  collection: customers
  columns:
    c360_id: {path: _id, type: VARCHAR}
    financial_hardship_flag: {path: hardship_indicators.financial_hardship_flag, type: BOOLEAN}
    hardship_reasons: {path: hardship_indicators.reasons, type: VARCHAR, join: "; "}
    max_dpd: {path: exposure.max_dpd, type: BIGINT}
    worst_bucket: {path: exposure.worst_bucket, type: VARCHAR}
    past_due_total: {path: exposure.past_due_total, type: DOUBLE}
    card_balance_total: {path: exposure.card_balance_total, type: DOUBLE}
    loan_outstanding_total: {path: exposure.loan_outstanding_total, type: DOUBLE}
    delinquent_accounts: {path: exposure.delinquent_accounts, type: BIGINT}
    product_count: {path: exposure.product_count, type: BIGINT}
    open_cases: {path: collections.open_cases, type: BIGINT}
    min_link_confidence: {path: identity.min_link_confidence, type: DOUBLE}
    links_pending_review: {path: identity.links_pending_review, type: BIGINT}

