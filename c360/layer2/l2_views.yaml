    stale_score_flag: {expr: b.stale_score_flag, optional: true}
    c360_id: x.c360_id
    pull_date: b.pull_date
    risk_score: b.risk_score

salary_credit_history:
  grain: one row per deposit account per month
  description: Monthly salary credits detected on deposit accounts.
  required: true
  confidence: confirmed
  source: |
    SELECT {cols}
    FROM src.curated.salary_credit_history s
    LEFT JOIN src.golden.account_xref x ON x.account_id = s.deposit_account_id AND x.role = 'primary'
