model_scores:
  grain: one row per model score
  description: Scores from the bank's existing models. Rows scored twice at the same timestamp are flagged dq_superseded_duplicate.
  required: true
  confidence: confirmed
  source: |
    SELECT {cols}
    FROM src.curated.model_scores m
    LEFT JOIN src.golden.crm_person_map pm ON pm.crm_customer_id = m.crm_customer_id
    LEFT JOIN src.golden.case_xref cx ON cx.case_id = m.case_id
  columns:
    entity_type: {expr: m.entity_type, optional: true}
    slot_label: {expr: m.slot_label, optional: true}
    risk_grade: {expr: m.risk_grade, optional: true}
    predicted_value: {expr: m.predicted_value, optional: true}
    score_id: m.score_id
    c360_id: coalesce(pm.c360_id, cx.c360_id)
    case_id: m.case_id
    model_name: m.model_name
    model_version: m.model_version
    score_ts: m.score_ts
    score_date: m.score_date
    score: m.score
    score_band: m.score_band
    recommended_action: m.recommended_action
    top_reason_1_text: m.top_reason_1_text
    uses_protected_attributes: m.uses_protected_attributes
    dq_superseded_duplicate: m.dq_superseded_duplicate

