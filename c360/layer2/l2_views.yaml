    link_payment_flag: {expr: h.link_payment_flag, optional: true}
    contact_id: h.contact_id
    case_id: h.case_id
    account_id: h.account_id
    c360_id: gp.c360_id
    contact_ts_utc: h.contact_ts_utc
    contact_ts_local: h.contact_ts_local
    contact_hour_local: h.contact_hour_local
    channel: h.channel_std
    direction: h.direction
    outcome_code: h.outcome_code
    agent_id: h.agent_id
    talk_duration_sec: h.talk_duration_sec
    sms_template_id: h.sms_template_id
    letter_template_id: h.letter_template_id
    email_template_id: h.email_template_id
    payment_amount: h.payment_amount
    payment_taken_flag: h.payment_taken_flag
    ptp_id: h.ptp_id
    rpc_flag: h.rpc_flag
