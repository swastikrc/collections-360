    dispute_raised_flag: h.dispute_raised_flag
    complaint_raised_flag: h.complaint_raised_flag
    cease_request_flag: h.cease_request_flag
    dq_duplicate_of: h.dq_duplicate_of
    is_duplicate: h.dq_duplicate_of IS NOT NULL
    dq_channel_renamed: h.dq_channel_renamed

agent_notes:
  grain: one row per agent note
  description: Free-text notes written by agents on collections cases. The text is searchable through search_text only.
  required: true
  confidence: confirmed
  text_index: {id: note_id, column: note_text}
  source: |
    SELECT {cols}
    FROM src.curated.agent_notes n
    LEFT JOIN src.golden.case_xref cx ON cx.case_id = n.case_id
  columns:
    contact_id: {expr: n.contact_id, optional: true}
    account_id: {expr: n.account_id, optional: true}
    note_source: {expr: n.note_source, optional: true}
    note_id: n.note_id
    note_ts: n.note_ts
    note_type: n.note_type
    agent_id: n.agent_id
    case_id: n.case_id
    c360_id: cx.c360_id
    note_text: n.note_text

call_transcripts:
  grain: one row per call transcript
  description: Call transcripts. The text is searchable through search_text only.
  required: true
  confidence: confirmed
  text_index: {id: transcript_id, column: transcript_text}
  # The publisher reads each transcript JSON file under the dataset root and exposes the parsed
  # text as the temporary table named here. file_path itself is not copied.
  # base_dirs: folders under the dataset root that file_path may be relative to, tried in order.
  # Real release: file_path = transcripts/YYYY/MM/<id>.json under <dataset>/files/.
  file_text:
    base_dirs: [files, ""]
    temp_table: transcript_text_files
    query: SELECT transcript_id, file_path FROM src.curated.call_transcripts
    id_column: transcript_id
    path_column: file_path
    text_column: transcript_text
  source: |
    SELECT {cols}
    FROM src.curated.call_transcripts t
    LEFT JOIN src.golden.case_xref cx ON cx.case_id = t.case_id
    LEFT JOIN transcript_text_files tt ON tt.transcript_id = t.transcript_id
  columns:
    agent_id: {expr: t.agent_id, optional: true}
    call_end_ts: {expr: t.call_end_ts, optional: true}
    transcript_id: t.transcript_id
    contact_id: t.contact_id
    case_id: t.case_id
    c360_id: cx.c360_id
    call_start_ts: t.call_start_ts
    duration_sec: t.duration_sec
    direction: t.direction
    language: t.language
    transcript_text: tt.transcript_text

bureau_latest:
  grain: one row per person (latest bureau pull)
  description: Latest credit bureau pull per person. Rows hit by load incident DFI-0812 are flagged dq_shifted_row.
  required: true
  confidence: confirmed
  source: |
    SELECT {cols}
    FROM src.curated.external e
    LEFT JOIN src.golden.source_customer_xref x ON x.src_system = 'core' AND x.src_ref = e.cif
    QUALIFY row_number() OVER (PARTITION BY coalesce(x.c360_id, e.cif) ORDER BY e.pull_date DESC) = 1
  columns:
    c360_id: x.c360_id
    pull_date: e.pull_date
    hit_status: e.hit_status
    risk_score: e.risk_score
    risk_score_prev_3m: e.risk_score_prev_3m
    risk_score_delta_90d: e.risk_score_delta_90d
    bankruptcy_score: e.bankruptcy_score
    inquiries_hard_6m: e.inquiries_hard_6m
    inquiries_hard_3m: e.inquiries_hard_3m_std
    revolving_utilisation: e.revolving_utilisation
    total_monthly_obligations: e.total_monthly_obligations
    total_balance_all_trades: e.total_balance_all_trades
    off_us_revolving_balance: e.off_us_revolving_balance
    off_us_delinquent_trades: e.off_us_delinquent_trades
    collection_items_count: e.collection_items_count
    high_cost_lender_trades_count: e.high_cost_lender_trades_count
    bnpl_trades_count: e.bnpl_trades_count
    new_trades_6m: e.new_trades_6m
    bankruptcy_on_file_flag: e.bankruptcy_on_file_flag
    consumer_proposal_on_file_flag: e.consumer_proposal_on_file_flag
    deceased_indicator: e.deceased_indicator
    fraud_alert_flag: e.fraud_alert_flag
    address_mismatch_flag: e.address_mismatch_flag
    dq_shifted_row: e.dq_shifted_row

bureau_history:
  grain: one row per person per bureau pull
  description: History of bureau risk scores.
  required: true
  confidence: confirmed
  source: |
    SELECT {cols}
    FROM src.curated.bureau_history b
    LEFT JOIN src.golden.source_customer_xref x ON x.src_system = 'core' AND x.src_ref = b.cif
  columns:
    hit_status: {expr: b.hit_status, optional: true}
    revolving_utilisation: {expr: b.revolving_utilisation, optional: true}
    delinquent_trades_count: {expr: b.delinquent_trades_count, optional: true}
